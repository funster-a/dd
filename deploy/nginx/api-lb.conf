# Балансировщик api (ADR 023): вход на порт 8080 для внешних клиентов,
# провайдера платежей и нагрузочных экспериментов. Экземпляры api — реплики
# сервиса Compose: Docker DNS отдаёт адреса всех реплик, nginx переразрешает
# имя каждые 10 секунд и распределяет запросы по кругу. Поэтому
# `docker compose up --scale api=N` подхватывается без перезапуска.
# Кэш на краю (ADR 031) — на месте CDN: публичные GET (страница события,
# список событий, занятость мест) держатся столько, сколько разрешает
# Cache-Control ответа api, и для всех покупателей одни и те же.
# Одновременные промахи по одному адресу идут в api одним запросом
# (proxy_cache_lock), устаревший ответ отдаётся, пока обновляется свежий.
# Ответы с Set-Cookie, приватные и без Cache-Control nginx не кэширует.
proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:20m max_size=200m inactive=10m use_temp_path=off;

server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Живость самого балансировщика; здоровье api — /healthz и /readyz
    # через прокси ниже.
    location = /lb-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/v1/(public/|events/[^/]+/availability$) {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error;
        proxy_connect_timeout 2s;
        proxy_read_timeout 70s;

        proxy_cache edge;
        proxy_cache_key $request_method$request_uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Экземпляр не принял соединение (перезапуск, масштабирование вниз) —
        # запрос уходит на другой. Ответивший экземпляр не повторяется:
        # POST мог уже выполниться, повтор — дело клиента с ключом
        # идемпотентности (ADR 008).
        proxy_next_upstream error;
        proxy_connect_timeout 2s;
        proxy_read_timeout 70s;
        client_max_body_size 1m;
    }
}
