# Воркер (ADR 012, ADR 023): релей outbox и обработчики очередей. Экземпляры
# конкурируют за строки outbox (SKIP LOCKED) и сообщения, поэтому их тоже
# можно масштабировать.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: dd-worker
          ports:
            - {name: metrics, containerPort: 9091}
          env:
            - {name: METRICS_ADDR, value: ":9091"}
          envFrom:
            - configMapRef: {name: app-env}
            - secretRef: {name: app-secrets}
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits: {memory: 256Mi}
          # HTTP у воркера — только метрики; отвечают, пока процесс жив.
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
