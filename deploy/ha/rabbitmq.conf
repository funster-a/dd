# Кластер RabbitMQ из трёх узлов (ADR 030). Узлы находят друг друга по
# списку; кворумные очереди держат копии на всех трёх.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-0
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-2
# Узел в меньшинстве при разделении сети останавливается, а не продолжает
# принимать сообщения сам по себе.
cluster_partition_handling = pause_minority
default_user = dd
default_pass = dd
loopback_users = none
# Сообщения, выданные потребителю на недоступном узле, кворумная очередь
# держит за ним consumer_disconnected_timeout и только потом отдаёт другим:
# при разделении сети узел мог бы их уже обработать. По умолчанию — минута,
# и столько ждали бы оплаты, взятые в работу за миг до падения узла. 15 секунд:
# обработчики идемпотентны (ADR 012), повтор после короткого разделения
# безопасен.
consumer_disconnected_timeout = 15000
