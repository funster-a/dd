# Локальный запуск проекта: инфраструктура, миграции, api, worker и сайт.
# Значения по умолчанию подходят для локального запуска; переопределяются через .env.
name: dd

# Общие переменные api и worker: адреса зависимостей внутри сети compose.
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: 15s
  DATABASE_URL: postgres://${POSTGRES_USER:-dd}:${POSTGRES_PASSWORD:-dd}@postgres:5432/${POSTGRES_DB:-dd}?sslmode=disable
  REDIS_ADDR: redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-dd}:${RABBITMQ_PASSWORD:-dd}@rabbitmq:5672/
  # Адрес сайта для браузера: ссылки на билеты и возврат после оплаты.
  PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8000}
  # Мок платёжного провайдера (ADR 012); ключи — только для разработки.
  PSP_URL: http://fakepsp:8090
  PSP_API_KEY: dev-psp-api-key
  PSP_WEBHOOK_SECRET: dev-psp-webhook-secret
  PAYMENT_CALLBACK_URL: http://api:8080/v1/payments/webhooks/fakepsp

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dd}
      POSTGRES_DB: ${POSTGRES_DB:-dd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Через TCP, а не сокет: во время первой инициализации временный сервер
      # слушает только сокет, и migrate успел бы стартовать до открытия порта.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    # RabbitMQ хранит данные в каталоге по имени узла rabbit@<hostname>. Без
    # постоянного hostname пересозданный контейнер не увидит очереди в volume.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dd}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dd}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # S3-совместимое хранилище обложек и билетов (ADR 009). Бакет создаётся
  # при старте; обложки читаются без подписи, запись — только по ключам.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-bucket=${S3_BUCKET:-dd-media}", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.14.0
    # Метрики api (ADR 017): попытки захвата мест, отказы, повторы, задержка.
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Одноразовый сервис: применяет миграции и завершается. api стартует
  # только после его успешного завершения.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-dd}:${POSTGRES_PASSWORD:-dd}@postgres:5432/${POSTGRES_DB:-dd}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dd}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dd-secret-key}
      S3_BUCKET: ${S3_BUCKET:-dd-media}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Больше SHUTDOWN_TIMEOUT, чтобы Docker не прервал graceful shutdown.
    stop_grace_period: 20s

  # Мок внешнего платёжного провайдера: своя страница оплаты и вебхуки.
  # Карточных данных не принимает (CLAUDE.md, правило 7).
  fakepsp:
    build:
      context: .
      target: fakepsp
    environment:
      FAKEPSP_PUBLIC_URL: http://localhost:${FAKEPSP_PORT:-8090}
      # Мок помнит платежи после перезапуска: возвраты по старым оплатам работают.
      FAKEPSP_STATE_FILE: /data/fakepsp.json
      PSP_API_KEY: dev-psp-api-key
      PSP_WEBHOOK_SECRET: dev-psp-webhook-secret
    ports:
      - "127.0.0.1:${FAKEPSP_PORT:-8090}:8090"
    volumes:
      - fakepsp-data:/data
    healthcheck:
      test: ["CMD", "/fakepsp", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  # Сайт покупателя (ADR 015): nginx со сборкой Vue, /v1 проксирует в api.
  web:
    build:
      context: ./web
    environment:
      API_UPSTREAM: http://api:8080
      MEDIA_ORIGIN: http://localhost:${S3_PORT:-8333}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy

configs:
  seaweedfs-s3:
    content: |
      {"identities": [
        {"name": "dd",
         "credentials": [{"accessKey": "${S3_ACCESS_KEY:-dd}", "secretKey": "${S3_SECRET_KEY:-dd-secret-key}"}],
         "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
        {"name": "anonymous", "actions": ["Read:${S3_BUCKET:-dd-media}"]}
      ]}
  prometheus-config:
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: api
          static_configs:
            - targets: ["api:8080"]
  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  seaweedfs-data:
  fakepsp-data:
