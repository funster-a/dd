<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="Когда прошла последняя покупка"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="24" y="34" font-size="18" font-weight="600" fill="#0b0b0b">Когда прошла последняя покупка</text><text x="24" y="56" font-size="12.5" fill="#52514e">Секунд от старта продаж. С очередью дольше: покупателей пускают с постоянной скоростью.</text><line x1="230.0" y1="96" x2="230.0" y2="312" stroke="#e6e4df" stroke-width="1"/><text x="230.0" y="330" font-size="11.5" fill="#52514e" text-anchor="middle">0</text><line x1="350.0" y1="96" x2="350.0" y2="312" stroke="#e6e4df" stroke-width="1"/><text x="350.0" y="330" font-size="11.5" fill="#52514e" text-anchor="middle">10</text><line x1="470.0" y1="96" x2="470.0" y2="312" stroke="#e6e4df" stroke-width="1"/><text x="470.0" y="330" font-size="11.5" fill="#52514e" text-anchor="middle">20</text><line x1="590.0" y1="96" x2="590.0" y2="312" stroke="#e6e4df" stroke-width="1"/><text x="590.0" y="330" font-size="11.5" fill="#52514e" text-anchor="middle">30</text><line x1="710.0" y1="96" x2="710.0" y2="312" stroke="#e6e4df" stroke-width="1"/><text x="710.0" y="330" font-size="11.5" fill="#52514e" text-anchor="middle">40</text><text x="230" y="84" font-size="11.5" fill="#52514e">с</text><text x="218" y="134.5" font-size="13" fill="#0b0b0b" text-anchor="end">Без очереди, без кэша сводки</text><rect x="230" y="117.0" width="400.7" height="26" rx="3" fill="#c0321d"/><line x1="620.9" y1="130.0" x2="640.5" y2="130.0" stroke="#0b0b0b" stroke-width="1.5"/><text x="648.5" y="134.5" font-size="12.5" font-weight="600" fill="#0b0b0b">33</text><text x="218" y="186.5" font-size="13" fill="#0b0b0b" text-anchor="end">Без очереди</text><rect x="230" y="169.0" width="286.2" height="26" rx="3" fill="#eb6834"/><line x1="492.8" y1="182.0" x2="539.5" y2="182.0" stroke="#0b0b0b" stroke-width="1.5"/><text 