# Миграции — отдельная задача перед выкаткой api (ADR 032): несколько реплик
# api не должны применять их одновременно. goose идемпотентен, повторный
# запуск ничего не меняет.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: dd-migrate
          args: ["up"]
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef: {name: app-secrets, key: DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
