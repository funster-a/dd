# Край (ADR 031, ADR 032): nginx перед api — кэш публичных GET по
# Cache-Control и распределение запросов по подам api. На продакшене перед
# ним CDN; сам край масштабируется отдельно от api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Сборка nginx без root: процесс не нужен root, порт 8080.
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /lb-healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /lb-healthz, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: config, mountPath: /etc/nginx/templates/default.conf.template, subPath: default.conf.template}
            # Конфиг из шаблона, кэш и временные файлы — в памяти пода.
            - {name: conf-d, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: edge-nginx}
        - name: conf-d
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
