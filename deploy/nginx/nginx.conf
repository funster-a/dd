# Основной конфиг балансировщика api (ADR 023, ADR 031). Отличие от
# стандартного — лимит соединений: на старте продаж тысячи покупателей держат
# соединения одновременно, и стандартные 1024 на процесс (каждое
# проксируемое соединение занимает два) рвали бы их раньше, чем устанет api.
worker_processes auto;
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
