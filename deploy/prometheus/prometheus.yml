# Prometheus платформы (ADR 022). Метрики собираются каждые 5 секунд:
# эксперименты длятся десятки секунд, более редкий сбор их не увидит.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # api и worker в Docker Compose: реплики находятся через Docker DNS, каждая
  # собирается отдельно (ADR 023).
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8080
        refresh_interval: 10s
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 10s

  # api и worker, запущенные на машине разработчика (make run, нагрузочные
  # эксперименты). В полном Compose эти цели недоступны, и это нормально:
  # алерт «цель недоступна» их не учитывает.
  - job_name: api-local
    static_configs:
      # 8080 — одиночный api (make run), 8081–8084 — экземпляры эксперимента
      # с масштабированием (loadtest/scale.sh).
      - targets: ["host.docker.internal:8080", "host.docker.internal:8081", "host.docker.internal:8082",
                  "host.docker.internal:8083", "host.docker.internal:8084"]
  - job_name: worker-local
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  # Встроенный экспортёр RabbitMQ (плагин rabbitmq_prometheus).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
