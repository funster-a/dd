# Генерация типобезопасного кода запросов (ADR 007). Схема — goose-миграции;
# у каждого модуля свои запросы и свой сгенерированный пакет.
# Сгенерировать: make sqlc
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
