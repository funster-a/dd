# Prometheus платформы (ADR 022). Метрики собираются каждые 5 секунд:
# эксперименты длятся десятки секунд, более редкий сбор их не увидит.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # api и worker в Docker Compose.
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9091"]

  # api и worker, запущенные на машине разработчика (make run, нагрузочные
  # эксперименты). В полном Compose эти цели недоступны, и это нормально:
  # алерт «цель недоступна» их не учитывает.
  - job_name: api-local
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: worker-local
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  # Встроенный экспортёр RabbitMQ (плагин rabbitmq_prometheus).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
