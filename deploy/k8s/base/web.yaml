# Сайт (ADR 015): статика Vue и /v1 через край. Нагрузка — отдача файлов,
# которые браузер кэширует; двух экземпляров достаточно.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: dd-web
          ports:
            - {name: http, containerPort: 80}
          env:
            - {name: API_UPSTREAM, value: "http://edge:8080"}
            - name: MEDIA_ORIGIN
              valueFrom:
                configMapKeyRef: {name: app-env, key: S3_PUBLIC_ENDPOINT}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - {name: http, port: 80, targetPort: http}
